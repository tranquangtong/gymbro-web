<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f3f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141b21" media="(prefers-color-scheme: dark)">
  <meta name="description" content="GymBro — nhật ký ăn uống, tập luyện và tiến bộ của bạn.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>GymBro · Nhật ký mỗi ngày</title>
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <!-- Start sign-in, API and font connections while critical modules load. -->
  <link rel="preconnect" href="https://gymbro-api.tongquangtran.workers.dev" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://securetoken.googleapis.com">
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js">
  <link rel="modulepreload" href="./src/app.js">
  <link rel="modulepreload" href="./src/ui/dashboard.js">
  <link rel="modulepreload" href="./src/ui/lazy.js">
  <link rel="modulepreload" href="./src/core/core.js">
  <link rel="modulepreload" href="./src/data/access.js">
  <link rel="modulepreload" href="./src/data/backend.js">
  <link rel="modulepreload" href="./src/data/cloudflare.js">
  <link rel="modulepreload" href="./src/data/firebase.js">
  <link rel="modulepreload" href="./src/data/snapshot.js">
  <link rel="modulepreload" href="./src/data/sync.js">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap"></noscript>
  <link rel="stylesheet" href="./assets/style.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Đến nội dung chính</a>
  <aside class="sidebar">
    <a class="brand" href="#dashboard" aria-label="GymBro, Hôm nay"><svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect class="logo-bar" x="4" y="29" width="56" height="6" rx="3"/><rect class="logo-food" x="13" y="12" width="13" height="40" rx="4"/><rect class="logo-gym" x="38" y="12" width="13" height="40" rx="4"/></svg><span>gymbro</span></a>
    <nav id="navigation" aria-label="Điều hướng chính"></nav>
  </aside>
  <!-- Floating account avatar and menu (top right on every page). -->
  <div id="account" class="account-float"></div>
  <!-- Phones: brand at top left, level with the avatar. -->
  <a class="phone-brand" href="#dashboard" aria-label="GymBro, Hôm nay"><svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect class="logo-bar" x="4" y="29" width="56" height="6" rx="3"/><rect class="logo-food" x="13" y="12" width="13" height="40" rx="4"/><rect class="logo-gym" x="38" y="12" width="13" height="40" rx="4"/></svg><span>gymbro</span></a>
  <div class="shell">
    <div id="storage-banner" class="storage-banner" role="status"></div>
    <main id="main" tabindex="-1"></main>
    
  </div>
  <dialog id="editor" aria-labelledby="dialog-title"></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
